<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد بازار | Market Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
 --bg1:#0a0f1f; --bg2:#131b33;
 --card1:#1a2640ee; --card2:#101a2dee;
 --line:rgba(255,255,255,.1); --txt:#eef4ff; --muted:#8fa0bd;
 --green:#2ee6a8; --red:#ff6b81; --accent:#315da8;
 --shadow:0 18px 45px #0005;
}
[data-theme="neon"]{
 --bg1:#05010f; --bg2:#0d0420;
 --card1:rgba(20,8,45,.92); --card2:rgba(10,4,28,.95);
 --line:rgba(180,100,255,.35); --txt:#f2e9ff; --muted:#b39ddb;
 --green:#00ffc6; --red:#ff2e88; --accent:#a855f7;
 --shadow:0 0 30px rgba(168,85,247,.35), 0 0 70px rgba(0,255,198,.12);
}
[data-theme="glass"]{
 --bg1:#070d20; --bg2:#111d3b;
 --card1:rgba(23,38,70,.72); --card2:rgba(10,20,43,.82);
 --line:rgba(151,205,255,.20); --txt:#f4f8ff; --muted:#a8bad8;
 --green:#62f3d0; --red:#ff7898; --accent:#83a8ff;
 --shadow:0 22px 55px rgba(0,0,0,.48), 0 8px 24px rgba(35,94,180,.12);
}
[data-theme="glass"] body{
 background:
  radial-gradient(ellipse at 12% 4%,rgba(90,117,255,.27),transparent 38%),
  radial-gradient(ellipse at 88% 10%,rgba(55,225,220,.19),transparent 36%),
  radial-gradient(ellipse at 75% 85%,rgba(135,105,255,.18),transparent 42%),
  radial-gradient(ellipse at 10% 90%,rgba(35,135,190,.14),transparent 38%),
  linear-gradient(145deg,#070d20 0%,#101a35 48%,#091329 100%);
 background-attachment:fixed;
}
[data-theme="glass"] body::before{
 content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;
 background-image:linear-gradient(rgba(175,210,255,.045) 1px,transparent 1px),
                  linear-gradient(90deg,rgba(175,210,255,.045) 1px,transparent 1px);
 background-size:46px 46px;
 mask-image:linear-gradient(to bottom,black,transparent 82%);
}
[data-theme="glass"] .card,
[data-theme="glass"] .mini-card{
 position:relative;overflow:hidden;
 background:linear-gradient(145deg,rgba(35,54,91,.78),rgba(10,19,42,.88) 72%);
 backdrop-filter:blur(22px) saturate(145%);
 -webkit-backdrop-filter:blur(22px) saturate(145%);
 border:1px solid rgba(174,211,255,.22);
 box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(94,158,255,.08);
 transition:transform .28s ease,box-shadow .32s ease,border-color .32s ease;
 transform-style:preserve-3d;
}
[data-theme="glass"] .card::before,
[data-theme="glass"] .mini-card::before{
 content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(ellipse at 12% 0%,rgba(127,190,255,.17),transparent 48%),
            linear-gradient(120deg,rgba(255,255,255,.055),transparent 38%,rgba(102,226,231,.035));
}
[data-theme="glass"] .card::after,
[data-theme="glass"] .mini-card::after{
 content:'';position:absolute;top:-65%;left:-45%;width:42%;height:230%;
 pointer-events:none;z-index:0;transform:rotate(28deg);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.075),transparent);
 transition:left .7s ease;
}
[data-theme="glass"] .card:hover::after,
[data-theme="glass"] .mini-card:hover::after{left:120%}
[data-theme="glass"] .card > *,
[data-theme="glass"] .mini-card > *{position:relative;z-index:1}
[data-theme="glass"] .card:hover,
[data-theme="glass"] .mini-card:hover{
 border-color:rgba(119,225,235,.48);
 box-shadow:0 28px 65px rgba(0,0,0,.55),0 0 28px rgba(87,166,255,.16),
            inset 0 1px 0 rgba(255,255,255,.2);
}
[data-theme="glass"] .btn{
 background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
 border-color:rgba(159,203,255,.24);
 backdrop-filter:blur(12px);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
[data-theme="glass"] .btn:hover{border-color:rgba(117,229,229,.55);box-shadow:0 8px 22px rgba(30,135,190,.16)}
[data-theme="glass"] .btn.active{
 background:linear-gradient(120deg,#73e9df,#9eb8ff 58%,#b7a5ff);
 border-color:transparent;color:#08152b;
 box-shadow:0 7px 22px rgba(101,205,225,.24),inset 0 1px 0 rgba(255,255,255,.55);
 font-weight:bold;
}
[data-theme="glass"] .price{
 color:#e8ffff;
 text-shadow:0 0 18px rgba(103,226,224,.25),0 2px 12px rgba(0,0,0,.35);
}
[data-theme="glass"] .logo{
 background:linear-gradient(145deg,#8cf3e5 0%,#8faeff 55%,#b79aff 100%);
 box-shadow:0 10px 28px rgba(94,171,230,.3),inset 0 1px 2px rgba(255,255,255,.65);
 color:#101a36;
}
[data-theme="glass"] .chg{background:rgba(98,243,208,.10);border:1px solid rgba(98,243,208,.16);color:var(--green)}
[data-theme="glass"] .chg.neg{background:rgba(255,120,152,.10);border-color:rgba(255,120,152,.16);color:var(--red)}
[data-theme="glass"] .range{
 background:rgba(7,16,36,.48);border-color:rgba(159,203,255,.17);
}
[data-theme="glass"] .range.active{
 background:linear-gradient(120deg,#73e9df,#9eb8ff 65%,#b7a5ff);
 color:#08152b;border-color:transparent;
 box-shadow:0 5px 16px rgba(104,196,224,.2);
}
[data-theme="glass"] .field input,[data-theme="glass"] .field select,
[data-theme="glass"] .add-row select,[data-theme="glass"] .add-row input{
 background:rgba(5,13,30,.58);border-color:rgba(150,201,255,.22);
 box-shadow:inset 0 2px 10px rgba(0,0,0,.18);
}
[data-theme="glass"] .result,
[data-theme="glass"] .total-box{
 background:linear-gradient(125deg,rgba(83,207,202,.19),rgba(117,146,255,.2) 58%,rgba(173,143,255,.17));
 border:1px solid rgba(154,213,255,.25);
 box-shadow:0 14px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.16);
}
[data-theme="glass"] .holding{
 background:linear-gradient(120deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
 border-color:rgba(159,203,255,.17);
}
[data-theme="glass"] .add-row button{
 background:linear-gradient(120deg,#73e9df,#9eb8ff 65%,#b7a5ff);
 color:#08152b;box-shadow:0 8px 22px rgba(104,196,224,.2);
}
[data-theme="glass"] .btn-mini{
 background:rgba(255,255,255,.055);border-color:rgba(159,203,255,.2);
}
[data-theme="glass"] .btn-mini:hover{
 background:linear-gradient(120deg,#73e9df,#9eb8ff 65%,#b7a5ff);
 color:#08152b;border-color:transparent;box-shadow:0 7px 18px rgba(104,196,224,.2);
}
[data-theme="glass"] .chart-wrap{
 perspective:1100px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.22));
}
[data-theme="glass"] canvas{
 transform:perspective(1100px) rotateX(5deg);
 transform-origin:center bottom;
 filter:drop-shadow(0 8px 12px rgba(68,186,204,.10));
}
[data-theme="glass"] .card:hover canvas{transform:perspective(1100px) rotateX(1deg) translateY(-2px)}
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh; color:var(--txt); font-family:Tahoma,Arial,sans-serif;
 background:
  radial-gradient(circle at 15% 10%, #1e3a6e88, transparent 40%),
  radial-gradient(circle at 85% 20%, #146b6355, transparent 35%),
  radial-gradient(circle at 50% 90%, #3a1e6b55, transparent 40%),
  linear-gradient(160deg,var(--bg1),var(--bg2));
 background-attachment:fixed;
 transition:background .4s,color .3s;
}
[data-theme="neon"] body{
 background:
  radial-gradient(circle at 10% 0%, #3d0a6b, transparent 45%),
  radial-gradient(circle at 90% 10%, #00605a, transparent 40%),
  radial-gradient(circle at 50% 100%, #6b0a4a, transparent 45%),
  linear-gradient(160deg,var(--bg1),var(--bg2));
}
[data-theme="neon"] body::before{
 content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
 background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(168,85,247,.04) 2px 4px);
}
.app{max-width:1400px;margin:auto;padding:20px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{
 width:50px;height:50px;border-radius:16px;display:grid;place-items:center;
 font-size:24px;font-weight:bold;color:#fff;
 background:linear-gradient(145deg,#7eb0ff,#3158a4);
 box-shadow:0 8px 25px #315ba855, inset 0 1px 2px #ffffff55;
}
[data-theme="neon"] .logo{
 background:linear-gradient(145deg,#a855f7,#00ffc6);
 box-shadow:0 0 20px #a855f7aa, 0 0 40px #00ffc655;
}
.brand h1{font-size:19px}
[data-theme="neon"] .brand h1{
 background:linear-gradient(90deg,#a855f7,#00ffc6,#ff2e88);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
 padding:9px 14px;border:1px solid var(--line);border-radius:10px;
 background:var(--card1);color:var(--txt);cursor:pointer;transition:.2s;
}
.btn:hover{filter:brightness(1.15)}
.btn.active{background:var(--accent);border-color:#5789dc;color:#fff}
[data-theme="neon"] .btn{border-color:rgba(168,85,247,.4)}
[data-theme="neon"] .btn:hover{box-shadow:0 0 15px #a855f788,0 0 30px #00ffc633;border-color:#a855f7}
[data-theme="neon"] .btn.active{
 background:linear-gradient(135deg,#a855f7,#00ffc6);color:#0a0118;font-weight:bold;
 box-shadow:0 0 20px #a855f7cc;
}
.status{
 display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);
 padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.bad{background:var(--red);box-shadow:0 0 8px var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.card{
 background:linear-gradient(160deg,var(--card1),var(--card2));
 border:1px solid var(--line);border-radius:18px;padding:16px;
 box-shadow:var(--shadow), inset 0 1px 0 #ffffff0d;
 transition:transform .2s,box-shadow .2s,background .4s;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 0 0 1px var(--accent)}
[data-theme="neon"] .card{
 border:1px solid rgba(168,85,247,.3);
 position:relative;overflow:hidden;
}
[data-theme="neon"] .card::before{
 content:'';position:absolute;inset:-1px;border-radius:18px;padding:1px;
 background:linear-gradient(135deg,#a855f7,#00ffc6,#ff2e88,#a855f7);
 background-size:300% 300%;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 animation:neonBorder 4s linear infinite;
 pointer-events:none;opacity:.7;
}
@keyframes neonBorder{0%{background-position:0% 50%}100%{background-position:300% 50%}}
[data-theme="neon"] .card:hover{
 transform:translateY(-3px) scale(1.005);
 box-shadow:0 0 35px #a855f766,0 0 80px #00ffc622;
}
.mini-card{
 background:linear-gradient(160deg,var(--card1),var(--card2));
 border:1px solid var(--line);border-radius:14px;padding:12px;
 transition:transform .2s;
 display:flex;flex-direction:column;
}
.mini-card:hover{transform:translateY(-2px)}
[data-theme="neon"] .mini-card{border-color:rgba(168,85,247,.25)}
.mini-name{font-size:12px;font-weight:bold}
.mini-sym{font-size:9px;color:var(--muted);margin-top:2px}
.mini-price{font-size:16px;font-weight:bold;direction:ltr;text-align:right;margin-top:8px}
[data-theme="neon"] .mini-price{text-shadow:0 0 10px rgba(0,255,198,.4)}
.mini-range{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--line);margin-bottom:10px}
.mini-range b{color:var(--txt)}

.btn-mini{
 padding:6px 10px;font-size:10px;border-radius:8px;cursor:pointer;
 background:var(--card2);border:1px solid var(--line);color:var(--muted);transition:0.2s;
 width:100%;margin-top:auto;
}
.btn-mini:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="neon"] .btn-mini:hover{
 background:linear-gradient(135deg,#a855f7,#00ffc6);color:#0a0118;border-color:#00ffc6;
 box-shadow:0 0 15px #a855f7aa;
}
[data-theme="glass"] .btn-mini:hover{
 background:linear-gradient(135deg,#00ffd5,#7a5cff);color:#000;border-color:transparent;
 box-shadow:0 0 15px #00ffd5aa;
}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{font-size:15px;font-weight:bold}
[data-theme="neon"] .card-name{text-shadow:0 0 12px rgba(168,85,247,.5)}
.card-sym{font-size:10px;color:var(--muted);margin-top:4px}
.chg{font-size:11px;padding:5px 9px;border-radius:8px;background:#2ee6a81c;color:var(--green);white-space:nowrap}
.chg.neg{background:#ff6b811c;color:var(--red)}
[data-theme="neon"] .chg{background:rgba(0,255,198,.1);box-shadow:0 0 10px rgba(0,255,198,.3)}
[data-theme="neon"] .chg.neg{background:rgba(255,46,136,.1);box-shadow:0 0 10px rgba(255,46,136,.3)}
.price{font-size:22px;font-weight:bold;direction:ltr;text-align:right;margin-top:12px}
[data-theme="neon"] .price{text-shadow:0 0 15px rgba(0,255,198,.4)}
.unit{font-size:11px;color:var(--muted);font-weight:normal;margin-right:5px}
.day-range{
 display:flex;justify-content:space-between;gap:8px;
 font-size:10px;color:var(--muted);margin-top:8px;
 padding-top:8px;border-top:1px solid var(--line);
}
.day-range b{color:var(--txt);font-weight:600}
[data-theme="neon"] .day-range b{text-shadow:0 0 8px rgba(168,85,247,.4)}
.ranges{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 8px}
.range{
 padding:6px 9px;font-size:10px;border-radius:8px;
 background:var(--card2);color:var(--muted);border:1px solid var(--line);cursor:pointer;
}
.range.active{background:var(--accent);color:#fff;border-color:#5789dc}
[data-theme="neon"] .range.active{
 background:linear-gradient(135deg,#a855f7,#00ffc6);color:#0a0118;
 box-shadow:0 0 12px #a855f7aa;
}
.chart-wrap{height:190px;position:relative}
[data-theme="neon"] .chart-wrap{filter:drop-shadow(0 8px 20px rgba(168,85,247,.25))}
canvas{width:100%!important;height:100%!important;display:block}
[data-theme="neon"] canvas{
 transform:perspective(800px) rotateX(6deg);
 transform-origin:center bottom;transition:transform .4s;
}
[data-theme="neon"] .card:hover canvas{
 transform:perspective(800px) rotateX(2deg) scale(1.02);
}
.calc,.assets-page{display:none;margin-top:22px}
.calc.show,.assets-page.show{display:block}
.calc h2,.assets-page h2{font-size:18px;margin-bottom:6px}
.calc p,.assets-page p{font-size:12px;color:var(--muted);margin-bottom:16px}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.field input,.field select{
 width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
 padding:11px;color:var(--txt);outline:none;
}
[data-theme="neon"] .field input,[data-theme="neon"] .field select{
 border-color:rgba(168,85,247,.4);box-shadow:inset 0 0 12px rgba(168,85,247,.15);
}
.result{padding:16px;border-radius:12px;background:linear-gradient(110deg,var(--accent),var(--card1));color:#fff}
[data-theme="neon"] .result{
 background:linear-gradient(135deg,rgba(168,85,247,.8),rgba(0,255,198,.5));
 box-shadow:0 0 25px rgba(168,85,247,.4);
}
.result small{font-size:11px;opacity:.85}
.result .total{font-size:24px;font-weight:bold;direction:ltr;text-align:right;margin-top:8px}

.add-row{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-bottom:16px}
.add-row select,.add-row input{
 width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
 padding:11px;color:var(--txt);outline:none;
}
[data-theme="neon"] .add-row select,[data-theme="neon"] .add-row input{
 border-color:rgba(168,85,247,.4);box-shadow:inset 0 0 12px rgba(168,85,247,.15);
}
.add-row button{
 padding:11px 20px;border:none;border-radius:10px;cursor:pointer;
 background:var(--accent);color:#fff;font-weight:bold;
}
[data-theme="neon"] .add-row button{
 background:linear-gradient(135deg,#a855f7,#00ffc6);color:#0a0118;
 box-shadow:0 0 20px #a855f7aa;
}
[data-theme="glass"] .add-row button{
 background:linear-gradient(135deg,#00ffd5,#7a5cff);color:#000;box-shadow:0 0 20px #00ffd5aa;
}
.holdings{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.holding{
 display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1.2fr auto;
 gap:10px;align-items:center;
 padding:12px 14px;border-radius:12px;
 background:var(--card2);border:1px solid var(--line);
}
[data-theme="neon"] .holding{
 border-color:rgba(168,85,247,.25);
 box-shadow:inset 0 0 15px rgba(168,85,247,.08);
}
[data-theme="glass"] .holding{
 background:rgba(255,255,255,.04);border-color:rgba(0, 255, 213, 0.15);
}
.holding .h-name{font-weight:bold;font-size:13px}
.holding .h-qty{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.holding .h-price{font-size:12px;direction:ltr;text-align:right}
.holding .h-val{font-size:13px;font-weight:bold;direction:ltr;text-align:right;color:var(--green)}
[data-theme="neon"] .holding .h-val{text-shadow:0 0 10px rgba(0,255,198,.5)}
.holding .h-del{
 background:transparent;border:1px solid var(--red);color:var(--red);
 border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11px;
}
.holding .h-del:hover{background:var(--red);color:#fff}
.total-box{
 padding:18px;border-radius:14px;text-align:center;
 background:linear-gradient(135deg,var(--accent),var(--card1));color:#fff;
}
[data-theme="neon"] .total-box{
 background:linear-gradient(135deg,rgba(168,85,247,.85),rgba(0,255,198,.55));
 box-shadow:0 0 30px rgba(168,85,247,.5);
}
.total-box small{font-size:12px;opacity:.9}
.total-box .total-val{font-size:28px;font-weight:bold;direction:ltr;margin-top:8px}

.footer{text-align:center;font-size:10px;color:var(--muted);line-height:2;margin:24px 0 6px}
.footer a{color:var(--accent)}
.hidden{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
@media(max-width:600px){
 .app{padding:12px}.calc-grid{grid-template-columns:1fr}
 .add-row{grid-template-columns:1fr}
 .holding{grid-template-columns:1fr 1fr;gap:6px}
 .holding .h-del{grid-column:1/-1}
 .grid-mini{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand">
  <div class="logo">M</div>
  <div>
   <h1 data-t="title">داشبورد بازار</h1>
   <p data-t="subtitle">قیمت ارز، طلا، سکه و رمزارز با نمودار</p>
  </div>
 </div>
 <div class="actions">
  <div class="status"><i class="dot" id="dot"></i><span id="status">...</span></div>
  <button class="btn" id="themeBtn">🌙</button>
  <button class="btn" id="langBtn">English</button>
  <button class="btn active" id="homeBtn" data-t="prices">قیمت‌ها</button>
  <button class="btn" id="allBtn" data-t="allCharts">همه نمودارها</button>
  <button class="btn" id="calcBtn" data-t="calc">ماشین‌حساب</button>
  <button class="btn" id="assetsBtn" data-t="assets">دارایی‌ها</button>
  <button class="btn" id="refreshBtn" data-t="refresh">↻ بروزرسانی</button>
 </div>
</header>

<div id="homePage">
 <div class="grid" id="gridFeatured"></div>
 <div id="expandedChartContainer" class="hidden" style="margin-top:16px;margin-bottom:16px;"></div>
 <div class="grid-mini" id="gridMini"></div>
 <div style="text-align:center;margin:22px 0">
  <button class="btn" id="showAllBtn" data-t="showAll" style="padding:12px 30px;font-size:14px">مشاهده همه نمودارها</button>
 </div>
</div>

<div id="allPage" class="hidden">
 <div class="grid" id="gridAll"></div>
</div>

<section class="calc" id="calcPage">
 <h2 data-t="calcTitle">ماشین‌حساب قیمت</h2>
 <p data-t="calcSub">دارایی و مقدار را انتخاب کن.</p>
 <div class="calc-grid">
  <div class="field">

 fa:{title:'داشبورد بازار',subtitle:'قیمت ارز، طلا، سکه و رمزارز با نمودار',prices:'قیمت‌ها',allCharts:'همه نمودارها',calc:'ماشین‌حساب',assets:'دارایی‌ها',refresh:'↻ بروزرسانی',showAll:'مشاهده همه نمودارها',daily:'امروز',weekly:'این هفته',monthly:'این ماه',yearly:'امسال',all:'از اول',loading:'در حال دریافت...',noPrice:'قیمت ناموجود',connected:'متصل',failed:'خطا',tomanUnit:'تومان',calcTitle:'ماشین‌حساب قیمت',calcSub:'دارایی و مقدار را انتخاب کن.',choose:'انتخاب دارایی',qty:'تعداد / مقدار',totalLabel:'مبلغ محاسبه‌شده',disclaimer:'اطلاعات صرفاً جهت اطلاع‌رسانی است.',low:'کمترین امروز',high:'بیشترین امروز',assetsTitle:'دارایی‌های من',assetsSub:'دارایی‌ها و مقدارشان را وارد کن تا ارزش روزشان محاسبه شود.',add:'+ افزودن',qtyPlaceholder:'مقدار',totalAssets:'مجموع کل دارایی',emptyAssets:'هنوز دارایی‌ای اضافه نکردی.',del:'حذف',showChart:'مشاهده نمودار',hideChart:'بستن نمودار'},
 en:{title:'Market Dashboard',subtitle:'Currency, Gold, Coins & Crypto with charts',prices:'Prices',allCharts:'All charts',calc:'Calculator',assets:'Assets',refresh:'↻ Refresh',showAll:'View all charts',daily:'Today',weekly:'This week',monthly:'This month',yearly:'This year',all:'All history',loading:'Loading...',noPrice:'No price',connected:'Connected',failed:'Failed',tomanUnit:'Toman',calcTitle:'Price Calculator',calcSub:'Choose asset and quantity.',choose:'Choose asset',qty:'Quantity',totalLabel:'Calculated total',disclaimer:'For information only.',low:'Today low',high:'Today high',assetsTitle:'My Assets',assetsSub:'Enter your assets and quantities to calculate their value.',add:'+ Add',qtyPlaceholder:'Quantity',totalAssets:'Total assets value',emptyAssets:'No assets added yet.',del:'Delete',showChart:'Show Chart',hideChart:'Hide Chart'}
};

let lang='fa',theme='dark',prices={},history={},intraday={},remoteIntraday={},ranges={},charts={},sources={},holdings=[];
let expandedAssetId = null;
const INTRADAY_KEY='mktDashV29';
const HOLDINGS_KEY='mktDashHoldingsV1';
const $=id=>document.getElementById(id);
const t=k=>words[lang][k]||k;
const nm=a=>lang==='fa'?a.fa:a.en;

function num(v,d=0){return Number.isFinite(Number(v))?new Intl.NumberFormat(lang==='fa'?'fa-IR':'en-US',{maximumFractionDigits:d}).format(Number(v)):'---';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dayKey(time=Date.now()){
 const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(time));
 const g=x=>p.find(y=>y.type===x)?.value||'00';
 return `${g('year')}-${g('month')}-${g('day')}`;
}
function parseTime(v){if(v==null||v==='')return NaN;if(typeof v==='number')return v<1e12?v*1000:v;return Date.parse(v);}
async function fetchJson(url,tm=10000){
 const c=new AbortController(),id=setTimeout(()=>c.abort(),tm);
 try{const r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)throw 0;return await r.json();}
 finally{clearTimeout(id);}
}
function iranRows(p){const c=p?.data?.categories;if(!c||typeof c!=='object')return[];return Object.values(c).flatMap(x=>Array.isArray(x)?x:[]);}
function loadIntraday(){
 try{const s=JSON.parse(localStorage.getItem(INTRADAY_KEY)||'{}'),today=dayKey();
  for(const a of assets){const r=Array.isArray(s[a.id])?s[a.id]:[];
   intraday[a.id]=r.filter(p=>p&&Number(p.time)&&Number(p.price)>0&&dayKey(Number(p.time))===today).map(p=>({time:+p.time,price:+p.price}));}
 }catch(e){intraday={};}
}
function saveIntraday(){
 try{const today=dayKey(),d={};for(const a of assets){d[a.id]=(intraday[a.id]||[]).filter(p=>dayKey(p.time)===today).slice(-1000);}
  localStorage.setItem(INTRADAY_KEY,JSON.stringify(d));}catch(e){}
}
function record(id,price,time){
 if(!(price>0)||!Number.isFinite(time))return;
 const rows=(intraday[id]||[]).filter(p=>dayKey(p.time)===dayKey(time));
 const last=rows[rows.length-1];
 if(last&&time-last.time<30000)return;
 rows.push({time,price});intraday[id]=rows.slice(-1000);
}
function loadHoldings(){
 try{const s=JSON.parse(localStorage.getItem(HOLDINGS_KEY)||'[]');
  holdings=Array.isArray(s)?s.filter(h=>h&&h.id&&assets.some(a=>a.id===h.id)&&h.id!=='oil'&&Number(h.qty)>0):[];
 }catch(e){holdings=[];}
}
function saveHoldings(){
 try{localStorage.setItem(HOLDINGS_KEY,JSON.stringify(holdings));}catch(e){}
}

async function refreshPrices(){
 $('status').textContent=t('loading');
 try{
  const [data, intraData] = await Promise.all([
   fetchJson(LOCAL_PRICES_URL, 5000).catch(()=>null),
   fetchJson(LOCAL_INTRADAY_URL, 5000).catch(()=>null)
  ]);

  if(intraData && intraData.data){
   remoteIntraday = intraData.data;
  }

  if(data && data.prices && Object.keys(data.prices).length>0){
   const updatedAt=Number(data.updated_at)||Date.now();
   for(const k of Object.keys(prices)){if(k.startsWith('_'))delete prices[k];}
   Object.assign(prices,data.prices);
   if(data.sources)Object.assign(sources,data.sources);
   for(const a of assets){
    const p=data.prices[a.id];
    if(p>0)record(a.id,p,updatedAt);
   }
  }
  saveIntraday();
  const ok=Object.keys(prices).filter(k=>!k.startsWith('_')).length>0;
  $('dot').classList.toggle('bad',!ok);
  $('status').textContent=ok?t('connected'):t('failed');
  updatePricesOnly();
 }catch(e){
  $('dot').classList.add('bad');
  $('status').textContent=t('failed');
 }
}

function todayOHLC(id){
 const nlo=prices['_low_'+id],nhi=prices['_high_'+id];
 if(nlo>0&&nhi>0)return {low:nlo,high:nhi};
 const today=dayKey();
 const vals=[];
 for(const p of (history[id]||[])){
  if(dayKey(p.time)===today){
   if(Number(p.low)>0)vals.push(Number(p.low));
   if(Number(p.high)>0)vals.push(Number(p.high));
  }
 }
 if(vals.length)return {low:Math.min(...vals),high:Math.max(...vals)};
 const rows=(intraday[id]||[]).filter(p=>dayKey(p.time)===today&&Number(p.price)>0);
 if(!rows.length)return {low:0,high:0};
 const v=rows.map(p=>p.price);
 return {low:Math.min(...v),high:Math.max(...v)};
}

function getPrice(id){
 if(prices[id] > 0) return prices[id];
 const h = history[id] || [];
 if(h.length > 0) return h[h.length-1].price;
 return 0;
}

function formatPrice(a, p){
 if(p <= 0) return t('noPrice');
 if(a.currency === 'USD') return `$${num(p, 2)}`;
 return `${num(p)} <span class="unit">${t('tomanUnit')}</span>`;
}

function updatePricesOnly(){
 for(const a of assets){
  const p = getPrice(a.id);
  const priceHTML = formatPrice(a, p);
  
  const card=document.querySelector(`#chg-${a.id}`)?.closest('.card');
  if(card){
   const priceEl=card.querySelector('.price');
   if(priceEl) priceEl.innerHTML = priceHTML;
   
   const ohlc=todayOHLC(a.id);
   const dr=card.querySelector('.day-range');
   if(dr) {
    const isUSD = a.currency === 'USD';
    const lowStr = ohlc.low>0 ? (isUSD ? `$${num(ohlc.low, 2)}` : num(ohlc.low)) : '—';
    const highStr = ohlc.high>0 ? (isUSD ? `$${num(ohlc.high, 2)}` : num(ohlc.high)) : '—';
    dr.innerHTML=`<span>${t('low')}: <b>${lowStr}</b></span><span>${t('high')}: <b>${highStr}</b></span>`;
   }
   updateChange(a);
  }
  
  const mini=document.querySelector(`#mini-${a.id}`);
  if(mini){
   const mp=mini.querySelector('.mini-price');
   if(mp) mp.innerHTML = priceHTML;
   
   const ohlc=todayOHLC(a.id);
   const mr=mini.querySelector('.mini-range');
   if(mr) {
    const isUSD = a.currency === 'USD';
    const lowStr = ohlc.low>0 ? (isUSD ? `$${num(ohlc.low, 2)}` : num(ohlc.low)) : '—';
    const highStr = ohlc.high>0 ? (isUSD ? `$${num(ohlc.high, 2)}` : num(ohlc.high)) : '—';
    mr.innerHTML=`<span>${t('low')}: <b>${lowStr}</b></span><span>${t('high')}: <b>${highStr}</b></span>`;
   }
  }
 }
 
 for (const chartKey in charts) {
  if (!charts.hasOwnProperty(chartKey)) continue;
  let aId = chartKey;
  if (chartKey.includes('-')) aId = chartKey.split('-')[1];
  
  if((ranges[aId]||'daily')==='daily'){
   const a = assets.find(x=>x.id===aId);
   if (a) updateChartData(a, charts[chartKey]);
  }
 }
 renderHoldings();
 calc();
}

function updateChartData(a, chartInstance) {
 if(!chartInstance) return;
 const pts=pointsFor(a.id);
 if(pts.length === 0) return;
 
 const vals = pts.map(p=>p.price).filter(v => Number.isFinite(v) && v > 0);
 let yMin=0, yMax=100;
 if (vals.length > 0) {
  yMin = Math.min(...vals);
  yMax = Math.max(...vals);
  if(yMin===yMax){yMin*=.99;yMax*=1.01;}
  const pad=(yMax-yMin)*.1;
  yMin-=pad;yMax+=pad;
 }

 chartInstance.data.labels = pts.map(p=>p.intraday || !p.date
    ?new Date(p.time).toLocaleTimeString(lang==='fa'?'fa-IR':'en-GB',{hour:'2-digit',minute:'2-digit'})
    :(p.date||new Date(p.time).toLocaleDateString(lang==='fa'?'fa-IR':'en-US')));
    
 chartInstance.data.datasets.forEach(ds => { ds.data = pts.map(p=>p.price); });
 chartInstance.options.scales.y.min = yMin;
 chartInstance.options.scales.y.max = yMax;
 
 const isUp = pts.length > 1 ? (pts[pts.length-1].price >= pts[0].price) : true;
 updateChartTheme(chartInstance, a, isUp);
 chartInstance.update('none');
}

async function loadHistories(){
 try {
  await Promise.allSettled(assets.map(async a=>{
   const cands=[IM_CDN+'/history/'+encodeURIComponent(a.symbol)+'.json'];
   for(const u of cands){
    try{
     const pl=await fetchJson(u,10000);
     const rows=Array.isArray(pl?.data)?pl.data:Array.isArray(pl)?pl:[];
     const pts=rows.map(r=>({time:parseTime(r.t_tehran||r.t||r.timestamp||r.date),date:r.date_jalali||r.date||'',price:Number(r.close??r.price??r.value),low:Number(r.low??r.min??0),high:Number(r.high??r.max??0)})).filter(p=>Number.isFinite(p.time)&&p.price>0).sort((a,b)=>a.time-b.time);
     if(pts.length>=1){history[a.id]=pts;return;}
    }catch(e){}
   }
   history[a.id]=[];
  }));
  
  for (const chartKey in charts) {
    let aId = chartKey;
    if (chartKey.includes('-')) aId = chartKey.split('-')[1];
    const a = assets.find(x=>x.id===aId);
    if(a) {
       const chartInstance = charts[chartKey];
       const pts = pointsFor(a.id);
       if(pts.length > 0) {
           chartInstance.data.labels = pts.map(p=>p.intraday || !p.date
              ?new Date(p.time).toLocaleTimeString(lang==='fa'?'fa-IR':'en-GB',{hour:'2-digit',minute:'2-digit'})
              :(p.date||new Date(p.time).toLocaleDateString(lang==='fa'?'fa-IR':'en-US')));
           chartInstance.data.datasets.forEach(ds => { ds.data = pts.map(p=>p.price); });
           
           const vals = pts.map(p=>p.price).filter(v => Number.isFinite(v) && v > 0);
           let yMin=0, yMax=100;
           if (vals.length > 0) {
              yMin = Math.min(...vals);
              yMax = Math.max(...vals);
              if(yMin===yMax){yMin*=.99;yMax*=1.01;}
              const pad=(yMax-yMin)*.1;
              yMin-=pad;yMax+=pad;
           }
           chartInstance.options.scales.y.min = yMin;
           chartInstance.options.scales.y.max = yMax;
           
           const isUp = pts.length > 1 ? (pts[pts.length-1].price >= pts[0].price) : true;
           updateChartTheme(chartInstance, a, isUp);
           chartInstance.update('none');
       }
    }
  }
 } catch(e) {}
}

function calParts(p){
 const raw=String(p.date||'').trim();
 const m=raw.match(/^(\d{4})[\/-](\d{1,2})/);
 if(m)return{year:+m[1],month:+m[2]};
 const d=new Date(p.time);
 return{year:d.getFullYear(),month:d.getMonth()+1};
}
function sampleByDay(pts,max){
 if(pts.length<=max)return pts;
 const byDay={};
 pts.forEach(p=>{byDay[dayKey(p.time)]=p;});
 const days=Object.values(byDay).sort((a,b)=>a.time-b.time);
 if(days.length<=max)return days;
 return Array.from({length:max},(_,i)=>days[Math.round(i*(days.length-1)/(max-1))]);
}
function sampleByStep(pts,step){
 if(step<1)step=1;
 const out=[];
 for(let i=0;i<pts.length;i+=step)out.push(pts[i]);
 if(out[out.length-1]!==pts[pts.length-1])out.push(pts[pts.length-1]);
 return out;
}
function pointsFor(id){
 const all=history[id]||[];
 const mode=ranges[id]||'daily';
 
 if(mode==='daily'){
  const remoteIntr = (remoteIntraday[id] || []).filter(p=>dayKey(p.time)===dayKey());
  if(remoteIntr.length >= 2) return remoteIntr;
  
  const localIntr = (intraday[id]||[]).filter(p=>dayKey(p.time)===dayKey());
  if(localIntr.length >= 2) return localIntr;
  
  const histToday = all.filter(p=>dayKey(p.time)===dayKey());
  if(histToday.length >= 2) return histToday;
  
  if(remoteIntr.length > 0) return remoteIntr;
  if(localIntr.length > 0) return localIntr;
  if(histToday.length > 0) return histToday;
  
  if(prices[id] > 0) return [{time: Date.now(), price: prices[id]}];
  return [];
 }
 
 if(!all.length) return [];
 const latest=calParts(all[all.length-1]);
 if(mode==='all')return sampleByStep(all,Math.ceil(all.length/120));
 if(mode==='weekly'){
  const lastTime=all[all.length-1].time;
  return sampleByDay(all.filter(p=>p.time>=lastTime-7*24*60*60*1000),7);
 }
 if(mode==='monthly'){
  return sampleByDay(all.filter(p=>{const d=calParts(p);return d.year===latest.year&&d.month===latest.month;}),30);
 }
 if(mode==='yearly'){
  const year=all.filter(p=>calParts(p).year===latest.year);
  return sampleByStep(year,Math.max(1,Math.floor(year.length/24)));
 }
 return all;
}

    <button class="range ${mode==='yearly'?'active':''}" data-id="${a.id}" data-r="yearly">${t('yearly')}</button>

function bindRanges(grid, prefix=''){
 grid.querySelectorAll('.range').forEach(b=>{
  b.onclick=()=>{
   ranges[b.dataset.id]=b.dataset.r;
   const a=assets.find(x=>x.id===b.dataset.id);
   if(a){
     const chartKey = prefix + a.id;
     const chartInstance = charts[chartKey];
     if(chartInstance) {
        drawOrUpdateChart(a, chartInstance, prefix);
     } else {
        drawOrUpdateChart(a, null, prefix);
     }
   }
   grid.querySelectorAll(`.range[data-id="${b.dataset.id}"]`).forEach(x=>x.classList.remove('active'));
   b.classList.add('active');
  };
 });
}

function updateChartTheme(chartInstance, a, isUp) {
 const neon=theme==='neon', glass=theme==='glass';
 const light=theme==='light';
 const gc=light?'rgba(40,60,100,.12)':neon?'rgba(168,85,247,.15)':glass?'rgba(145,190,235,.12)':'rgba(160,185,225,.1)';
 const tc=light?'#5a6b88':neon?'#b39ddb':glass?'rgba(205,222,250,.82)':'#8fa0bd';
 
 chartInstance.options.scales.y.grid.color = gc;
 chartInstance.options.scales.y.ticks.color = tc;
 
 const isUSD = a.currency === 'USD';
 const ctx = chartInstance.ctx;
 const width = chartInstance.width || 500;

 if(glass) {
   const lineGrad = ctx.createLinearGradient(0, 0, width, 0);
   lineGrad.addColorStop(0,    '#22D3EE');
   lineGrad.addColorStop(.16,  '#3B82F6');
   lineGrad.addColorStop(.33,  '#6366F1');
   lineGrad.addColorStop(.50,  '#A855F7');
   lineGrad.addColorStop(.67,  '#EC4899');
   lineGrad.addColorStop(.83,  '#F97316');
   lineGrad.addColorStop(1,    '#FACC15');

   const fillGrad = ctx.createLinearGradient(0, 0, 0, 210);
   fillGrad.addColorStop(0, 'rgba(34,211,238,.23)');
   fillGrad.addColorStop(.28, 'rgba(99,102,241,.16)');
   fillGrad.addColorStop(.58, 'rgba(168,85,247,.10)');
   fillGrad.addColorStop(.82, 'rgba(236,72,153,.055)');
   fillGrad.addColorStop(1, 'rgba(249,115,22,0)');

   if(chartInstance.data.datasets.length === 3) {
      chartInstance.data.datasets[0].borderColor = 'rgba(4,12,30,.48)';
      chartInstance.data.datasets[1].borderColor = 'rgba(111,145,255,.22)';
      chartInstance.data.datasets[2].borderColor = lineGrad;
      chartInstance.data.datasets[2].backgroundColor = fillGrad;
   }
 } else {
   let color = isUp ? '#2ee6a8' : '#ff6b81';
   if (neon) color = isUp ? '#00ffc6' : '#ff2e88';
   
   const grad = ctx.createLinearGradient(0,0,0,200);
   if(neon){
      grad.addColorStop(0,isUp?'rgba(0,255,198,.55)':'rgba(255,46,136,.5)');
      grad.addColorStop(1,'rgba(10,4,28,0)');
   } else {
      grad.addColorStop(0,isUp?'rgba(46,230,168,.45)':'rgba(255,107,129,.4)');
      grad.addColorStop(1,'rgba(20,30,50,0)');
   }
   
   if(chartInstance.data.datasets.length === 1) {
      chartInstance.data.datasets[0].borderColor = color;
      chartInstance.data.datasets[0].backgroundColor = grad;
      chartInstance.data.datasets[0].shadowColor = neon?(isUp?'rgba(0,255,198,.6)':'rgba(255,46,136,.6)'):'transparent';
   }
 }
 
 chartInstance.options.plugins.tooltip.backgroundColor = neon?'rgba(10,4,28,.96)':glass?'rgba(9,18,39,.97)':'rgba(5,12,25,.96)';
 chartInstance.options.plugins.tooltip.borderColor = neon?(isUp?'#00ffc6':'#ff2e88'):glass?'rgba(126,210,231,.55)':'#70a4ff88';
 chartInstance.options.plugins.tooltip.callbacks.label = c=> (isUSD ? '$' : '') + num(c.parsed.y, isUSD ? 2 : 0) + ' ' + (isUSD ? '' : t('tomanUnit'));
 chartInstance.options.scales.y.ticks.callback = v=> (isUSD ? '$' : '') + num(v, isUSD ? 2 : 0);
}

function drawOrUpdateChart(a, chartInstance, prefix = '') {
 const pts = pointsFor(a.id);
 if(pts.length === 0) return;
 
 const neon=theme==='neon', glass=theme==='glass';
 const isUSD = a.currency === 'USD';
 const isUp = pts.length > 1 ? (pts[pts.length-1].price >= pts[0].price) : true;
 
 const vals = pts.map(p=>p.price).filter(v => Number.isFinite(v) && v > 0);
 let yMin=0, yMax=100;
 if (vals.length > 0) {
  yMin = Math.min(...vals);
  yMax = Math.max(...vals);
  if(yMin===yMax){yMin*=.99;yMax*=1.01;}
  const pad=(yMax-yMin)*.1;
  yMin-=pad;yMax+=pad;
 }

 const labels = pts.map(p=>p.intraday || !p.date
    ?new Date(p.time).toLocaleTimeString(lang==='fa'?'fa-IR':'en-GB',{hour:'2-digit',minute:'2-digit'})
    :(p.date||new Date(p.time).toLocaleDateString(lang==='fa'?'fa-IR':'en-US')));
 const dataVals = pts.map(p=>p.price);

 if(chartInstance) {
    chartInstance.data.labels = labels;
    chartInstance.data.datasets.forEach(ds => { ds.data = dataVals; });
    chartInstance.options.scales.y.min = yMin;
    chartInstance.options.scales.y.max = yMax;
    updateChartTheme(chartInstance, a, isUp);
    chartInstance.update('none');
    return;
 }

 const cv=$(`ch-${prefix}${a.id}`);
 if(!cv)return;
 const ctx=cv.getContext('2d');
 let datasets = [];

 if (glass) {
  const width = cv.offsetWidth || 500;
  const lineGrad = ctx.createLinearGradient(0, 0, width, 0);
  lineGrad.addColorStop(0,    '#22D3EE');
  lineGrad.addColorStop(.16,  '#3B82F6');
  lineGrad.addColorStop(.33,  '#6366F1');
  lineGrad.addColorStop(.50,  '#A855F7');
  lineGrad.addColorStop(.67,  '#EC4899');
  lineGrad.addColorStop(.83,  '#F97316');
  lineGrad.addColorStop(1,    '#FACC15');

  const fillGrad = ctx.createLinearGradient(0, 0, 0, 210);
  fillGrad.addColorStop(0, 'rgba(34,211,238,.23)');
  fillGrad.addColorStop(.28, 'rgba(99,102,241,.16)');
  fillGrad.addColorStop(.58, 'rgba(168,85,247,.10)');
  fillGrad.addColorStop(.82, 'rgba(236,72,153,.055)');
  fillGrad.addColorStop(1, 'rgba(249,115,22,0)');

  datasets.push({ data:dataVals,borderColor:'rgba(4,12,30,.48)',borderWidth:5, pointRadius:0,pointHoverRadius:0,fill:false,tension:.32,spanGaps:true, borderCapStyle:'round',borderJoinStyle:'round' });
  datasets.push({ data:dataVals,borderColor:'rgba(111,145,255,.22)',borderWidth:9, pointRadius:0,pointHoverRadius:0,fill:false,tension:.32,spanGaps:true, borderCapStyle:'round',borderJoinStyle:'round' });
  datasets.push({ data:dataVals,borderColor:lineGrad,backgroundColor:fillGrad, fill:true,tension:.32,borderWidth:3.2, pointRadius:0,pointHoverRadius:5, pointBackgroundColor:'#ffffff',pointBorderColor:'#a855f7', pointHoverBorderColor:'#22d3ee',pointBorderWidth:2,spanGaps:true, borderCapStyle:'round',borderJoinStyle:'round' });
 } else {
  let color = isUp ? '#2ee6a8' : '#ff6b81';
  if (neon) color = isUp ? '#00ffc6' : '#ff2e88';

  const grad=ctx.createLinearGradient(0,0,0,200);
  if(neon){
   grad.addColorStop(0,isUp?'rgba(0,255,198,.55)':'rgba(255,46,136,.5)');
   grad.addColorStop(1,'rgba(10,4,28,0)');
  } else {
   grad.addColorStop(0,isUp?'rgba(46,230,168,.45)':'rgba(255,107,129,.4)');
   grad.addColorStop(1,'rgba(20,30,50,0)');
  }

  datasets.push({ data:dataVals, borderColor:color,backgroundColor:grad,fill:true,tension:.35, borderWidth:neon?2.8:2.2, pointRadius:dataVals.length<3?4:0, pointHoverRadius:neon?7:5, pointHoverBackgroundColor:'#fff',pointHoverBorderColor:color, shadowOffsetX:0,shadowOffsetY:neon?4:0, shadowBlur:neon?15:0,shadowColor:neon?(isUp?'rgba(0,255,198,.6)':'rgba(255,46,136,.6)'):'transparent', spanGaps: true });
 }

 const light=theme==='light';
 const gc=light?'rgba(40,60,100,.12)':neon?'rgba(168,85,247,.15)':glass?'rgba(145,190,235,.12)':'rgba(160,185,225,.1)';
 const tc=light?'#5a6b88':neon?'#b39ddb':glass?'rgba(205,222,250,.82)':'#8fa0bd';

 const newChart = new Chart(ctx,{
  type:'line',
  data:{ labels: labels, datasets: datasets },
  plugins: glass ? [{ id:'glassDepth', beforeDatasetDraw(chart,args){ if(args.index===0){chart.ctx.save();chart.ctx.translate(0,4);} }, afterDatasetDraw(chart,args){ if(args.index===0){chart.ctx.restore();} } }] : [],
  options:{
   responsive:true,maintainAspectRatio:false,
   animation:false,
   interaction:{mode:'index',intersect:false},
   plugins:{
    legend:{display:false},
    tooltip:{
     filter: item => !glass || item.datasetIndex === 2,
     backgroundColor:neon?'rgba(10,4,28,.96)':glass?'rgba(9,18,39,.97)':'rgba(5,12,25,.96)',
     borderColor:neon?(isUp?'#00ffc6':'#ff2e88'):glass?'rgba(126,210,231,.55)':'#70a4ff88',borderWidth:1,
     titleFont:{family:'Tahoma',size:11},bodyFont:{family:'Tahoma',size:11},
     callbacks:{label:c=> (isUSD ? '$' : '') + num(c.parsed.y, isUSD ? 2 : 0) + ' ' + (isUSD ? '' : t('tomanUnit'))}
    }
   },
   scales:{
    x:{display:false},
    y:{min:yMin,max:yMax,grid:{color:gc},ticks:{color:tc,font:{family:'Tahoma',size:9},callback:v=> (isUSD ? '$' : '') + num(v, isUSD ? 2 : 0)}}
   }
  }
 });
 
 const chartKey = prefix + a.id;
 charts[chartKey] = newChart;
}

function renderCharts(grid, filterIds, prefix=''){
 requestAnimationFrame(() => {
  requestAnimationFrame(() => {
   assets.forEach(a => {
    if(filterIds && !filterIds.includes(a.id)) return;
    const chartKey = prefix + a.id;
    if(!charts[chartKey]) {
        drawOrUpdateChart(a, null, prefix);
    } else {
        drawOrUpdateChart(a, charts[chartKey], prefix);
    }
    updateChange(a);
   });
  });
 });
}

function renderFeatured(){
 const grid=$('gridFeatured');
 const mini=$('gridMini');
 if(!grid||!mini)return;
 
 if(!grid.innerHTML) {
    const featured=assets.filter(a=>a.id==='usd'||a.id==='usdt');
    const rest=assets.filter(a=>a.id!=='usd'&&a.id!=='usdt');
    grid.innerHTML=featured.map(a=>fullCardHTML(a, 'feat-')).join('');
    mini.innerHTML=rest.map(miniCardHTML).join('');
    bindRanges(grid, 'feat-');
    
    mini.querySelectorAll('.toggle-mini-chart').forEach(btn => {
     btn.onclick = () => toggleExpandedChart(btn.dataset.id);
    });
    updateMiniCardButtons();
 }
 
 renderCharts(grid, ['usd', 'usdt'], 'feat-');

 if (expandedAssetId) {
  renderExpandedChart();
 }
}

function toggleExpandedChart(id) {
 if (expandedAssetId === id) {
  closeExpandedChart();
 } else {
  openExpandedChart(id);
 }
}

function openExpandedChart(id) {
 if (expandedAssetId) closeExpandedChart();
 expandedAssetId = id;
 const container = $('expandedChartContainer');
 const a = assets.find(x => x.id === id);
 if(!a) return;
 
 container.innerHTML = `
  <div style="position: relative;">
   <button id="closeExpandedBtn" class="btn" style="position: absolute; top: 16px; left: 16px; z-index: 10; padding: 6px 12px; font-size: 12px; background: var(--red); border-color: var(--red); color: white;">${t('hideChart')}</button>
   ${fullCardHTML(a, 'exp-')}
  </div>
 `;
 container.classList.remove('hidden');
 bindRanges(container, 'exp-');
 
 $('closeExpandedBtn').onclick = closeExpandedChart;
 
 setTimeout(() => {
  const chartKey = 'exp-' + a.id;
  if(!charts[chartKey]) drawOrUpdateChart(a, null, 'exp-');
  else drawOrUpdateChart(a, charts[chartKey], 'exp-');
  container.scrollIntoView({ behavior: 'smooth', block: 'center' });
 }, 50);
 
 updateMiniCardButtons();
}

function renderExpandedChart() {
 if (!expandedAssetId) return;
 const a = assets.find(x => x.id === expandedAssetId);
 const container = $('expandedChartContainer');
 if(!a) return;
 
 container.innerHTML = `
  <div style="position: relative;">
   <button id="closeExpandedBtn" class="btn" style="position: absolute; top: 16px; left: 16px; z-index: 10; padding: 6px 12px; font-size: 12px; background: var(--red); border-color: var(--red); color: white;">${t('hideChart')}</button>
   ${fullCardHTML(a, 'exp-')}
  </div>
 `;
 container.classList.remove('hidden');
 bindRanges(container, 'exp-');
 $('closeExpandedBtn').onclick = closeExpandedChart;
 
 setTimeout(() => {
  const chartKey = 'exp-' + a.id;
  if(!charts[chartKey]) drawOrUpdateChart(a, null, 'exp-');
  else drawOrUpdateChart(a, charts[chartKey], 'exp-');
 }, 50);
}

function closeExpandedChart() {
 if (!expandedAssetId) return;
 const chartKey = 'exp-' + expandedAssetId;
 if (charts[chartKey]) {
  charts[chartKey].destroy();
  delete charts[chartKey];
 }
 expandedAssetId = null;
 $('expandedChartContainer').classList.add('hidden');
 $('expandedChartContainer').innerHTML = '';
 updateMiniCardButtons();
}

function updateMiniCardButtons() {
 document.querySelectorAll('.toggle-mini-chart').forEach(btn => {
  if (btn.dataset.id === expandedAssetId) {
   btn.textContent = t('hideChart');
   btn.classList.add('active');
  } else {
   btn.textContent = t('showChart');
   btn.classList.remove('active');
  }
 });
}

function renderAll(){
 const grid=$('gridAll');
 if(!grid)return;
 
 if(!grid.innerHTML) {
    grid.innerHTML=assets.map(a=>fullCardHTML(a, 'all-')).join('');
    bindRanges(grid, 'all-');
 }
 
 renderCharts(grid, null, 'all-');
}

function updateChange(a){
 const el=$('chg-'+a.id);
 const h=history[a.id]||[];
 if(!el||h.length<2)return;
 const x=h[h.length-1].price,y=h[h.length-2].price;
 const pct=(x-y)/y*100;
 el.textContent=(pct>0?'+':'')+num(pct,2)+'%';
 el.classList.toggle('neg',pct<0);
}

function renderHoldings(){
 const box=$('holdings');
 if(!box)return;
 if(!holdings.length){
  box.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:12px;padding:20px">${t('emptyAssets')}</div>`;
  $('totalAssets').textContent='---';
  return;
 }
 let total=0;
 box.innerHTML=holdings.map((h,idx)=>{
  const a=assets.find(x=>x.id===h.id);
  const p=getPrice(h.id);
  const val=p*Number(h.qty);
  total+=val;
  return `
  <div class="holding">
   <div class="h-name">${esc(a?nm(a):h.id)}</div>
   <div class="h-qty">${num(h.qty,4)}</div>
   <div class="h-price">${p>0?num(p):'—'}</div>
   <div class="h-val">${val>0?num(val)+' '+t('tomanUnit'):'—'}</div>
   <button class="h-del" data-idx="${idx}">${t('del')}</button>
  </div>`;
 }).join('');
 $('totalAssets').textContent=num(total)+' '+t('tomanUnit');
 box.querySelectorAll('.h-del').forEach(b=>{
  b.onclick=()=>{holdings.splice(Number(b.dataset.idx),1);saveHoldings();renderHoldings();};
 });
}

function fillAddSelect(){
 const s=$('addAsset');
 if(!s)return;
 const old=s.value;
 const availableAssets = assets.filter(a => a.id !== 'oil');
 s.innerHTML=availableAssets.map(a=>`<option value="${a.id}">${esc(nm(a))}</option>`).join('');
 if(availableAssets.some(a=>a.id===old))s.value=old;
}
function addHolding(){
 const id=$('addAsset')?.value;
 const qty=Number($('addQty')?.value||0);
 if(!id||id==='oil'||!(qty>0))return;
 const ex=holdings.find(h=>h.id===id);
 if(ex)ex.qty=Number(ex.qty)+qty;
 else holdings.push({id,qty});
 saveHoldings();
 $('addQty').value='';
 renderHoldings();
}

function applyLang(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(el=>{
  if(el.tagName==='INPUT')el.placeholder=t(el.dataset.t);
  else el.textContent=t(el.dataset.t);
 });
 $('langBtn').textContent=lang==='fa'?'English':'فارسی';
 
 for(const a of assets) {
   const card = document.querySelector(`#chg-${a.id}`)?.closest('.card');
   if(card) {
      const nameEl = card.querySelector('.card-name');
      if(nameEl) nameEl.textContent = nm(a);
   }
   const mini = document.querySelector(`#mini-${a.id}`);
   if(mini) {
      const nameEl = mini.querySelector('.mini-name');
      if(nameEl) nameEl.textContent = nm(a);
   }
 }
 
 for (const chartKey in charts) {
    let aId = chartKey;
    if (chartKey.includes('-')) aId = chartKey.split('-')[1];
    const a = assets.find(x=>x.id===aId);
    if(a) {
       updateChartTheme(charts[chartKey], a, true);
       charts[chartKey].update('none');
    }
 }
 
 fillCalc();
 fillAddSelect();
 renderHoldings();
 calc();
 updateMiniCardButtons();
}

function applyTheme(){
 document.documentElement.setAttribute('data-theme',theme);
 $('themeBtn').textContent = theme==='dark' ? '🌙' : theme==='neon' ? '⚡' : '💎';
 
 for (const chartKey in charts) {
    let aId = chartKey;
    if (chartKey.includes('-')) aId = chartKey.split('-')[1];
    const a = assets.find(x=>x.id===aId);
    if(a) {
       updateChartTheme(charts[chartKey], a, true);
       charts[chartKey].update('none');
    }
 }
}

function fillCalc(){
 const s=$('assetSelect'),old=s.value;
 s.innerHTML=assets.map(a=>`<option value="${a.id}">${esc(nm(a))}</option>`).join('');
 if(assets.some(a=>a.id===old))s.value=old;
}
function calc(){
 const id=$('assetSelect')?.value;
 const a=assets.find(x=>x.id===id);
 const q=Number($('qty')?.value||0);
 const p=getPrice(id);
 if(!a||!(p>0)||!Number.isFinite(q)){
  $('total').textContent=t('noPrice');
  $('calcUnit').textContent='';
  return;
 }
 
 let finalPrice = p;
 let unitLabel = t('tomanUnit');

 if (a.id === 'oil') {
  const usdRate = getPrice('usd');
  finalPrice = p * usdRate;
  $('calcUnit').textContent = `قیمت نفت: $${num(p,2)} × نرخ دلار: ${num(usdRate)} تومان · ${lang==='fa'?a.unitFa:a.unitEn}`;
 } else {
  $('calcUnit').textContent = `${num(p)} ${t('tomanUnit')} · ${lang==='fa'?a.unitFa:a.unitEn}`;
 }

 $('total').textContent = num(finalPrice * q) + ' ' + unitLabel;
}

function hideAllPages(){
 $('homePage').classList.add('hidden');
 $('allPage').classList.add('hidden');
 $('calcPage').classList.remove('show');
 $('assetsPage').classList.remove('show');
 ['homeBtn','allBtn','calcBtn','assetsBtn'].forEach(id=>$(id).classList.remove('active'));
}

$('langBtn').onclick=()=>{lang=lang==='fa'?'en':'fa';try{localStorage.setItem('mktLang',lang)}catch(e){}applyLang();};
$('themeBtn').onclick=()=>{
 theme = theme === 'dark' ? 'neon' : theme === 'neon' ? 'glass' : 'dark';
 try{localStorage.setItem('mktTheme',theme)}catch(e){}
 applyTheme();
};
$('homeBtn').onclick=()=>{hideAllPages();$('homePage').classList.remove('hidden');$('homeBtn').classList.add('active');renderFeatured();};
$('allBtn').onclick=()=>{hideAllPages();$('allPage').classList.remove('hidden');$('allBtn').classList.add('active');renderAll();};
$('showAllBtn').onclick=()=>{hideAllPages();$('allPage').classList.remove('hidden');$('allBtn').classList.add('active');renderAll();};
$('calcBtn').onclick=()=>{hideAllPages();$('calcPage').classList.add('show');$('calcBtn').classList.add('active');fillCalc();calc();};
$('assetsBtn').onclick=()=>{hideAllPages();$('assetsPage').classList.add('show');$('assetsBtn').classList.add('active');fillAddSelect();renderHoldings();};
$('addBtn').onclick=addHolding;
$('refreshBtn').onclick=async()=>{await Promise.allSettled([refreshPrices(),loadHistories()]);};
$('qty').oninput=calc;
$('assetSelect').onchange=calc;

let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{},200);});

(async function init(){
 try{
  const s=localStorage.getItem('mktLang');if(s==='fa'||s==='en')lang=s;
  const th=localStorage.getItem('mktTheme');if(th==='dark'||th==='neon'||th==='glass')theme=th;
 }catch(e){}
 loadIntraday();
 loadHoldings();
 
 applyTheme();
 applyLang();
 renderFeatured();
 
 refreshPrices().then(() => {
    applyLang();
 });
 
 setTimeout(() => {
    loadHistories();
 }, 2000);

 setInterval(refreshPrices, 1*60*1000);
 setInterval(loadHistories, 30*60*1000);
})();
</script>
</body>
</html>
