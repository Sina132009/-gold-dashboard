name: Update Market Prices

on:
  schedule:
    - cron: '*/15 * * * *' # هر ۱۵ دقیقه اجرا می‌شود
  workflow_dispatch: # امکان اجرای دستی هم وجود دارد

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run price update script
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add data/latest-prices.json data/intraday.json
          git commit -m "Auto-update market prices" || exit 0
          git push
