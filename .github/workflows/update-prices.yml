name: Update Prices Data

on:
  schedule:
    # هر ۱۵ دقیقه یک‌بار اجرا می‌شود (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/latest-prices.json
          git diff --staged --quiet || git commit -m "Auto-update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
