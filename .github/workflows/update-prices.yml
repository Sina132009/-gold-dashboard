name: Auto Update Prices

on:
  schedule:
    # اجرای خودکار هر ۵ دقیقه
    - cron: '*/5 * * * *'
  workflow_dispatch: # با این گزینه می‌توانید دستی هم ربات را اجرا کنید

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Script
        env:
          TALASANJ_API_KEY: ${{ secrets.TALASANJ_API_KEY }}
        run: python fetch_prices.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Auto update prices [skip ci]" || exit 0
          git push
