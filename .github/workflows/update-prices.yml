name: Update Market Prices

on:
  schedule:
    - cron: '*/15 * * * *' # هر ۱۵ دقیقه اجرا می‌شود
  workflow_dispatch: # امکان اجرای دستی هم وجود دارد

# جلوگیری از اجرای همزمان چند اکشن
concurrency:
  group: update-prices-group
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run price update script
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          # کشیدن آخرین تغییرات برای جلوگیری از تداخل (اگر خودت همزمان کد رو آپدیت کردی)
          git pull --rebase
          # اضافه کردن کل پوشه data (در صورت وجود فایل‌های جدید)
          git add data/
          # [skip ci] باعث میشه این کامیت باعث اجرای مجدد اکشن‌ها نشه
          git commit -m "Auto-update market prices [skip ci]" || exit 0
          git push
