name: Update Market Prices

on:
  schedule:
    - cron: '*/15 * * * *' # هر ۱۵ دقیقه اجرا می‌شود
  workflow_dispatch: # امکان اجرای دستی

# دسترسی نوشتن برای اینکه بتونه فایل‌ها رو آپدیت کنه
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run price update script
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add data/
          git commit -m "Auto-update market prices [skip ci]" || exit 0
          git push
