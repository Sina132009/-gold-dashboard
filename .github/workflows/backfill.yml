name: Backfill 1 Year History

on:
  workflow_dispatch: # فقط با دکمه دستی اجرا می‌شود

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Backfill Script
        env:
          TALASANJ_API_KEY: ${{ secrets.TALASANJ_API_KEY }}
        run: python backfill_history.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Backfill 1 year history [skip ci]" || exit 0
          git push
